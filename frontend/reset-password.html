<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="customAlert">
    <div class="alert-box">
        <div class="alert-icon" id="alertIcon">⚠️</div>
        <h3 id="alertTitle">Notice</h3>
        <p id="alertMessage">Something happened.</p>
        <button class="alert-btn" id="alertBtn" onclick="closeAlert()">OK</button>
    </div>
</div>
<div class="auth-container">
    <div class="auth-left">
        <h1>Student CGPA System</h1>
        <p>Reset your password to regain access.</p>
    </div>
    <div class="auth-card">
        <h1>Student CGPA</h1>
        <h2>Reset Password</h2>
        <p>Enter your new password below.</p>
        <form id="resetPasswordForm">
            <input type="password" id="newResetPassword" placeholder="New Password" required>
            <input type="password" id="confirmResetPassword" placeholder="Confirm New Password" required>
            <button type="submit">Reset Password</button>
        </form>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
